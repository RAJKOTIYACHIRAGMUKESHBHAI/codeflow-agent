spring.application.name=codeflow-agent

nebius.api.base-url=https://api.tokenfactory.nebius.com/v1
nebius.api.key=${NEBIUS_API_KEY:}

codeflow.maven-wrapper=${CODEFLOW_MAVEN_WRAPPER:}


spring.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-origins=http://localhost:5173

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/codeflow_agent
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

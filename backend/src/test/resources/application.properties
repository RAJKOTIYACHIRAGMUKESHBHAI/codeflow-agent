spring.datasource.url=jdbc:mysql://localhost:3306/codeflow_agent_test
spring.datasource.username=${DB_USERNAME:codeflow_test}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Nebius AI configuration for tests
nebius.api.base-url=https://api.tokenfactory.nebius.com/v1
nebius.api.key=${NEBIUS_API_KEY:}
codeflow.maven-wrapper=${CODEFLOW_MAVEN_WRAPPER:}
